# Vendor onboarding approval.
workflow_id: vendor_approval
version: 1
name: Vendor Approval
description: Mandatory checks -> business registry (GST) lookup -> compliance -> contract routing.
max_retry_attempts: 2

input_schema:
  vendor_name:       { type: string, min_length: 2 }
  gstin:             { type: string, pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$" }
  category:          { type: string, enum: [it_services, raw_materials, logistics, consulting] }
  annual_turnover:   { type: number, min: 0 }
  years_in_business: { type: integer, min: 0 }
  has_iso_cert:      { type: boolean }
  contract_value:    { type: number, min: 1 }

start_stage: mandatory_checks

stages:
  mandatory_checks:
    type: rules
    rules:
      - id: VEN-001
        description: Vendor must be in business for at least 2 years
        condition: { field: years_in_business, op: gte, value: 2 }
        on_fail: REJECTED
      - id: VEN-002
        description: Annual turnover must be at least 10 lakh
        condition: { field: annual_turnover, op: gte, value: 1000000 }
        on_fail: REJECTED
    on_pass: { next: registry_lookup }

  registry_lookup:
    type: enrich
    service: business_registry
    inputs: { gstin: gstin }
    output_key: registry
    retry: { max_attempts: 3, base_delay_ms: 150 }
    on_success: { next: compliance }
    on_failure: { decision: RETRY_PENDING, reason: GST registry unavailable }

  compliance:
    type: rules
    rules:
      - id: CMP-001
        description: GST registration must be active
        condition: { field: registry.gst_status, op: eq, value: active }
        on_fail: REJECTED
      - id: CMP-002
        description: Vendor must not be blacklisted
        condition: { field: registry.blacklisted, op: is_false }
        on_fail: REJECTED
    on_pass: { next: contract_routing }

  contract_routing:
    type: branch
    branches:
      - label: large_contract
        when: { field: contract_value, op: gt, value: 5000000 }
        then: { decision: MANUAL_REVIEW, reason: Contracts above 50 lakh need procurement committee approval }
      - label: uncertified_service_vendor
        when:
          all:
            - { field: category, op: in, value: [it_services, consulting] }
            - { field: has_iso_cert, op: is_false }
        then: { decision: MANUAL_REVIEW, reason: Service vendors without ISO certification need security review }
    default: { decision: APPROVED, reason: Vendor meets all onboarding criteria }
